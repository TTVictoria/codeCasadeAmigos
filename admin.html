<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casa de Amigos</title>

  <link href="https://cdn.tailwindcss.com" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css"
        integrity="sha512-4xo8blKMVCiXpTaLzQSLSw3KFOVPWhm/TRtuPVc4WG6kUgjH6J03IBuG7JZPkcWMxJ5huwaBpOpnwYElP/m6wg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
         <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
         <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>

<body>
      <header class="header-class">
        <div class="container container-header">
            <nav class="nav-header">
                <ul class="page-nav">
                    <!--Menu-->
                    <li><a href="" class="nav-link">Кімнати</a>
                    </li>
                    <li><a href="" class="nav-link">Календар</a>
                    </li>
                    <li><a href="" class="nav-link">Кімнати</a>
                    </li>
                </ul>
            </nav>
</header>

  <div class="center-content">
    <h1 class="casadeAmigos">Casa de Amigos</h1>
    <h3 class="zagolovok1">Online Booking System</h3>
    
  </div>

  <div class="page-wrapper">
    <img class="decoacrylic acrylic-1" src="./image/svg/acrylicleft.svg" alt="acrylic">
    <img class="decoacrylic acrylic-2" src="./image/svg/acrylicright.svg" alt="acrylic">

    <img class="deco deco-1 home" src="./image/svg/homeair.svg" alt="home">
    <img class="deco deco-2" src="./image/svg/palmsmall.svg" alt="palm">
    <img class="deco deco-3" src="./image/svg/palmbig.svg" alt="palm">
    <img class="deco deco-4" src="./image/svg/dog.svg" alt="dog">
    <img class="deco deco-5" src="./image/svg/swimmingpool.svg" alt="swimmingpool">
   
</div>


  <h2 class="zagolovok">Бронювання кімнат</h2>
<section class="booking-wrapper booking-section">
    <div class="booking-inner">
      <div class="booking-form-wrapper">
        <form class="booking-form" id="bookingForm">
            <label>
    Ім'я гостя:
    <input type="text" name="guest" list="guestList" required>
    <datalist id="guestList"></datalist>
           </label>

  <label>
    Дата заїзду:
    <input type="date" name="start" required>
  </label>

  <label>
    Дата виїзду:
    <input type="date" name="end" required>
  </label>

  <label>
    Дата прильоту:
    <input type="date" name="arrivalDate" required>
  </label>

  <label>
    Час прильоту:
    <input type="time" name="arrivalTime" required>
  </label>

  <label>
    Дата вильоту:
    <input type="date" name="departureDate" required>
  </label>

  <label>
    Час вильоту:
    <input type="time" name="departureTime" required>
  </label>

  <label>
    Забрати з аеропорту:
    <input type="checkbox" name="airportPickup">
  </label>

  <label>
    Дорослих:
    <input type="number" name="adults" min="1" required>
  </label>

  <label>
    Дітей:
    <input type="number" name="children" min="0" required>
  </label>

  <label>
    Обрати кімнату:
    <select name="room" id="roomSelect" required>
      <option value="">-- Оберіть --</option>
      <option value="El Azur">Кімната (біля басейну) “El Azur”</option>
      <option value="Los Olivos">Кімната (центр.буд.) “Los Olivos”</option>
      <option value="El Azahar">Кімната (центр.буд.) “El Azahar”</option>
      <option value="La Albahaca">Кімната (Ліза) “La Albahaca”</option>
      <option value="La Lavanda">Кімната (Лєна) “La Lavanda”</option>
    </select>
  </label>

  <button type="submit">Забронювати</button>
</form>
</div>

<div class="calendar-wrapper">
<div class="calendar-controls">
  <label for="roomFilter">Кімната:</label>
  <select id="roomFilter">
    <option value="all">Все</option>
    <option value="El Azur">El Azur</option>
    <option value="Los Olivos">Los Olivos</option>
    <option value="El Azahar">El Azahar</option>
    <option value="La Albahaca">La Albahaca</option>
    <option value="La Lavanda">La Lavanda</option>
  </select>

  <label for="departureFilter">Показати вильоти:</label>
  <select id="departureFilter">
    <option value="all">Показати все</option>
    <option value="departures">✈️</option>
  </select>
</div>

  <div id="calendar"></div>
</div>
</div>

</section>

<h2 class="zagolovok">Панель управління кімнатами</h2>



</body>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script type="module" src="./admin.js"></script>

</html>
