  <i class="fas fa-chevron-right"></i>
</button>

  <h2 class="zagolovok">Бронювання кімнат</h2>
<section class="booking-wrapper booking-section">
    <div class="booking-inner">
      <div class="booking-form-wrapper">
        <form class="booking-form" id="bookingForm">
           
          <!-- Гість -->
        <div class="">
          <label>
            Ім'я гостя:
            <input type="text" name="guest" list="guestList" required>
            <datalist id="guestList"></datalist>
          </label>
        </div>

        <!-- Дати проживання -->
        <div class="">
          <label>
            Дата заїзду:
            <input type="date" name="start" required>
          </label>
          
          <label>
            Дата виїзду:
            <input type="date" name="end" required>
          </label>
        </div>
        
        <!-- Приліт -->
        <div class="booking-block">
          <label class="icon-label">
            <i class="fas fa-plane-arrival"></i>
            Дата прильоту:
            <input type="date" name="arrivalDate" required>
          </label>
          
          <label>
            Час прильоту:
            <input type="time" name="arrivalTime" required>
          </label>
        </div>

        <!-- Виліт -->
        <div class="booking-block">
          <label class="icon-label">
            <i class="fas fa-plane-departure"></i>
            Дата вильоту:
            <input type="date" name="departureDate" required>
          </label>
          
          <label>
            Час вильоту:
            <input type="time" name="departureTime" required>
          </label>
        </div>


        <!-- Трансфер -->
        <div class="checkbox-block">
          <label class="checkbox-inline" style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" name="airport_pickup">
            <span>Забрати з аеропорту</span>
          </label>
        </div>


<!-- Дорослі та діти -->
<div class="row-inline quantity-row">
  <div class="quantity-block">
    <i class="fas fa-user" title="Дорослі"></i>
    <div class="quantity-control">
      <button type="button" class="qty-btn" onclick="changeQty('adults', -1)">−</button>
      <input type="number" name="adults" id="adults" min="1" value="1">
      <button type="button" class="qty-btn" onclick="changeQty('adults', 1)">+</button>
    </div>
  </div>


  <div class="quantity-block">
    <i class="fas fa-child" title="Діти"></i>
    <div class="quantity-control">
      <button type="button" class="qty-btn" onclick="changeQty('children', -1)">−</button>
      <input type="number" name="children" id="children" min="0" value="0">
      <button type="button" class="qty-btn" onclick="changeQty('children', 1)">+</button>
    </div>
  </div>
</div>

   <div class="">
  <label>
    Обрати кімнату:
    <select name="room" id="roomSelect" required>
      <option value="">-- Оберіть --</option>
      <option value="El Azur">Кімната “El Azur” (біля басейну)</option>
      <option value="Los Olivos">Кімната “Los Olivos” (центр.буд.)</option>
      <option value="El Azahar">Кімната “El Azahar” (центр.буд.)</option>
      <option value="La Albahaca">Кімната “La Albahaca” (Ліза)</option>
      <option value="La Lavanda">Кімната “La Lavanda” (Олена)</option>
    </select>
  </label>
  </div>

  <div class="">
    <button type="submit">Забронювати</button>
  </div>

</form>
</div>

<div class="calendar-wrapper">
<div class="calendar-controls">
  <label for="roomFilter">Кімната:</label>
  <select id="roomFilter">
    <option value="all">Все</option>
    <option value="El Azur">El Azur</option>
    <option value="Los Olivos">Los Olivos</option>
    <option value="El Azahar">El Azahar</option>
    <option value="La Albahaca">La Albahaca</option>
    <option value="La Lavanda">La Lavanda</option>
  </select>

  <label for="departureFilter">Показати вильоти:</label>
  <select id="departureFilter">
    <option value="all">Показати все</option>
    <option value="departures">✈️</option>
  </select>
</div>

  <div id="calendar"></div>
</div>
</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script type="module" src="./admin.js"></script>
<script>
  function changeQty(fieldId, delta) {
    const input = document.getElementById(fieldId);
    let value = parseInt(input.value, 10) || 0;
    const min = parseInt(input.min, 10) || 0;

    value += delta;
    if (value < min) value = min;
    input.value = value;
  }
</script>
